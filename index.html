<!DOCTYPE html>
<html lang="es" class="h-full bg-[#f8fafc] overflow-x-hidden w-full max-w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <base href="/">
  <title>Reservas CR - Directorio y Plataforma de Citas</title>
  
  <!-- Forzar Modo Claro Permanente -->
  <script>
    (function() {
      try {
        document.documentElement.classList.remove('dark');
        localStorage.removeItem('reservas_color_theme');
        localStorage.removeItem('reservas_theme_mode');
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  
  <!-- Preconnect & DNS-Prefetch for Fast PayPal Gateway Initialization -->
  <link rel="preconnect" href="https://www.paypal.com" crossorigin>
  <link rel="preconnect" href="https://www.paypalobjects.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.paypal.com">
  <link rel="dns-prefetch" href="https://www.paypalobjects.com">
  
  <!-- Google Material Symbols & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Precompiled Static Tailwind CSS (High-Performance & Zero-FOUC) -->
  <link rel="stylesheet" href="/public/css/tailwind.min.css?v=3.45.0">

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reservas CR">

  <!-- Favicon & Apple Touch Icons -->
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <link rel="apple-touch-icon" href="/favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="192x192" href="/src/assets/reservas_cr_clean_badge_1.png?v=4">

  <!-- Custom CSS: Formal Royal Navy & Sapphire -->
  <link rel="stylesheet" href="/src/styles/main.css?v=3.46.11">
</head>
<body class="min-h-full flex flex-col antialiased text-[#0f172a] bg-[#f8fafc] bg-luminous-gradient selection:bg-[#1e40af] selection:text-white overflow-x-hidden w-full max-w-full relative">

  <!-- Atmospheric Navy / Sapphire Glow Orbs -->
  <div class="fixed top-[8%] right-[-5%] w-80 h-80 bg-[#3b82f6]/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>
  <div class="fixed bottom-[12%] left-[-5%] w-96 h-96 bg-[#1e40af]/10 blur-[130px] rounded-full pointer-events-none -z-10"></div>

  <!-- Navbar Container -->
  <div id="navbar-container" class="w-full max-w-full"></div>

  <!-- Main Dynamic View Container -->
  <main id="main-content" class="flex-1 pb-24 md:pb-12 w-full max-w-full overflow-x-clip"></main>

  <!-- Footer -->
  <footer id="app-footer" class="bg-white/90 backdrop-blur-md border-t border-[#e2e8f0] py-8 px-4 text-center text-xs text-[#64748b] mb-14 md:mb-0">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <img src="/src/assets/reservas_cr_clean_badge_1.png?v=5" alt="Reservas CR Logo" class="w-7 h-7 rounded-full object-cover shadow-xs" onerror="this.onerror=null; this.src='/src/assets/logo.png';">
        <span class="font-headline font-bold text-[#0f172a] text-sm tracking-tight">Reservas <span class="text-[#2563eb]">CR</span></span> &copy; 2026. Todos los derechos reservados.
      </div>
      <p class="text-[#64748b] font-medium">Plataforma de conexión directa entre negocios locales y clientes en Costa Rica.</p>
    </div>
  </footer>

  <!-- Barra de Navegación Móvil Inferior Flotante -->
  <div id="mobile-bottom-nav-container"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

  <!-- SheetJS para Exportación de Reportes y Directorio de Clientes (.xlsx) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>

  <!-- App Script (ES Module) -->
  <script type="module" src="/src/app.js?v=3.46.11"></script>
</body>
</html>
