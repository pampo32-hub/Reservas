<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reservas CR - Directorio de Negocios y Reservas de Servicios Online</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SheetJS (XLSX) CDN para exportaciones nativas en Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reservas CR">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="./src/assets/reservas_cr_clean_badge_1.jpg">
  <link rel="apple-touch-icon" href="./src/assets/reservas_cr_clean_badge_1.jpg">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="min-h-full flex flex-col antialiased text-slate-900 bg-slate-50">

  <!-- Navbar Container -->
  <div id="navbar-container"></div>

  <!-- Main Dynamic View Container -->
  <main id="main-content" class="flex-1 pb-20 md:pb-0"></main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200/80 py-8 px-4 text-center text-xs text-slate-500 mb-16 md:mb-0">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl overflow-hidden shadow-xs border border-slate-200/60 flex items-center justify-center bg-white">
          <img src="./src/assets/reservas_cr_clean_badge_1.jpg" alt="Reservas CR Logo" class="w-full h-full object-cover">
        </div>
        <span class="font-extrabold text-slate-900 text-sm">Reservas <span class="text-blue-600">CR</span></span> &copy; 2026. Todos los derechos reservados.
      </div>
      <div class="flex flex-col sm:flex-row items-center gap-3">
        <p class="text-slate-400">Plataforma de conexión directa entre negocios locales y clientes en Costa Rica 🇨🇷.</p>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 text-slate-100 text-[11px] font-bold shadow-xs border border-slate-800">
          <span class="text-slate-400 font-medium">Powered by</span>
          <span class="text-blue-400 font-extrabold tracking-wide flex items-center gap-1">
            <i class="fas fa-cube text-[10px] text-blue-400"></i> GeoSoft
          </span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Barra de Navegación Móvil Inferior (Estilo App Nativa - Solo Móvil/Tablet) -->
  <div id="mobile-bottom-nav-container" class="md:hidden"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 sm:right-6 z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

  <!-- App Script (ES Module) con versión para invalidar caché -->
  <script type="module" src="./src/app.js?v=5.0"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('✅ [PWA] Service Worker registrado exitosamente. Alcance:', reg.scope))
          .catch((err) => console.warn('⚠️ [PWA] Error registrando Service Worker:', err));
      });
    }
  </script>
</body>
</html>
