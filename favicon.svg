<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradado vibrante de fondo: Azul Cobalto a Índigo Real -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    
    <!-- Degradado verde esmeralda vibrante para el Checkmark -->
    <linearGradient id="emeraldCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Sombra sutil para profundidad -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Fondo Cuadrado con Bordes Redondeados (Azul / Índigo Vibrante) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- 2. Tarjeta de Calendario Central Blanca con Relieve y Sombra -->
  <rect x="96" y="110" width="320" height="300" rx="36" fill="white" filter="url(#cardShadow)"/>
  
  <!-- 3. Franja Superior del Calendario (Azul Eléctrico) -->
  <path d="M96 146C96 126.118 112.118 110 132 110H380C399.882 110 416 126.118 416 146V180H96V146Z" fill="#3B82F6"/>
  
  <!-- 4. Anillos / Ganchos Superiores del Calendario -->
  <rect x="156" y="80" width="28" height="56" rx="14" fill="white" stroke="#1E40AF" stroke-width="6"/>
  <rect x="328" y="80" width="28" height="56" rx="14" fill="white" stroke="#1E40AF" stroke-width="6"/>
  
  <!-- 5. Puntos / Cuadrícula de Días del Calendario -->
  <circle cx="156" cy="230" r="14" fill="#E2E8F0"/>
  <circle cx="216" cy="230" r="14" fill="#E2E8F0"/>
  <circle cx="276" cy="230" r="14" fill="#E2E8F0"/>
  <circle cx="336" cy="230" r="14" fill="#E2E8F0"/>
  
  <circle cx="156" cy="290" r="14" fill="#E2E8F0"/>
  <circle cx="216" cy="290" r="14" fill="#CBD5E1"/>
  <circle cx="276" cy="290" r="14" fill="#CBD5E1"/>
  <circle cx="336" cy="290" r="14" fill="#E2E8F0"/>
  
  <circle cx="156" cy="350" r="14" fill="#E2E8F0"/>
  <circle cx="216" cy="350" r="14" fill="#E2E8F0"/>
  
  <!-- 6. Ícono Checkmark Dinámico y Gigante en Verde Esmeralda Vibrante -->
  <path d="M190 280L260 350L430 170" stroke="url(#emeraldCheck)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 8px 16px rgba(16,185,129,0.45));"/>
</svg>
