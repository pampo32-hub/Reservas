name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Executing remote deploy script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          script: |
            /home/masteradmin/deploy.sh
            cd /home/masteradmin/reservascr || cd /var/www/reservascr || cd ~/reservascr || true
            npm install --no-audit --no-fund || true
            pm2 reload reservas || pm2 restart reservas || true

